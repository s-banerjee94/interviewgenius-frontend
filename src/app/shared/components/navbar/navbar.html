<p-menubar [dt]="menubar">
  <ng-template #start>
    <div class="flex items-center gap-3">
      <img src="/interview-genius-log.png" alt="InterviewGenius Logo" class="h-15" />
      <span class="text-xl font-bold">InterviewGenius</span>
    </div>
  </ng-template>

  <ng-template #end>
    <div class="flex gap-2">
      <p-button
        [icon]="isDarkMode() ? 'pi pi-sun' : 'pi pi-moon'"
        variant="text"
        (onClick)="toggleDarkMode()"
      />

      @if (!isAuthenticated()) {
        <p-button label="Sign In" [outlined]="true" severity="secondary" routerLink="/signin" />
        <p-button label="Sign Up" routerLink="/signup" />
      }

      @if (isAuthenticated()) {
        <div class="flex items-center gap-2">
          <p-button
            label="Dashboard"
            icon="pi pi-chart-bar"
            [outlined]="true"
            variant="text"
          />
          @if (userProfilePicture()) {
            <p-avatar
              [image]="userProfilePicture()!"
              shape="circle"
              (click)="toggleUserMenu($event)"
              class="cursor-pointer"
            />
          } @else {
            <p-avatar
              [label]="userInitials()"
              shape="circle"
              (click)="toggleUserMenu($event)"
              class="cursor-pointer"
            />
          }
          <p-menu #userMenu [model]="userMenuItems" [popup]="true" />
        </div>
      }
    </div>
  </ng-template>
</p-menubar>
