<div class="flex items-center justify-center min-h-screen bg-surface-50">
  <p-card class="w-full max-w-4xl">
    <div class="text-center mb-6">
      <h2 class="text-3xl font-bold text-surface-900 mb-2">Dashboard</h2>
      <p class="text-surface-600">Test the Auth Interceptor</p>
    </div>

    <div class="flex flex-col gap-4">
      <p-button
        label="Get User Details"
        (onClick)="getUserDetails()"
        [loading]="isLoading"
        class="w-full"
      />

      @if (userDetailsResponse) {
        <div class="bg-surface-100 p-4 rounded-lg">
          <h3 class="text-lg font-semibold text-surface-900 mb-2">Response:</h3>
          <pre class="text-sm text-surface-700 whitespace-pre-wrap break-all">{{ userDetailsResponse }}</pre>
        </div>
      }
    </div>
  </p-card>
</div>
